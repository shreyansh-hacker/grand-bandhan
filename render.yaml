# Grand Bandhan - Render Blueprint Deployment Configuration
# Backend API & Socket.IO Web Service

services:
  - type: web
    name: grand-bandhan-api
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install -g pnpm@10.11.0 && pnpm install --frozen-lockfile && pnpm run build:api
    startCommand: pnpm run start:api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NEON_BRANCH
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
