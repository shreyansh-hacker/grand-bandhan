# Grand Bandhan - Render Blueprint Deployment Configuration
# Backend API & Socket.IO Web Service

services:
  - type: web
    name: grand-bandhan-api
    env: node
    plan: starter
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @grand-bandhan/shared run build && pnpm --filter @grand-bandhan/validation run build && pnpm --filter @grand-bandhan/database run prisma:generate && pnpm --filter @grand-bandhan/database run build && pnpm --filter @grand-bandhan/api run build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NEON_BRANCH
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
