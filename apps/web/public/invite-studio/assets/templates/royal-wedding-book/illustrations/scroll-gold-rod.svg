<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 32" width="400" height="32" fill="none">
  <defs>
    <linearGradient id="rodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="30%" stop-color="#e0b863"/>
      <stop offset="70%" stop-color="#a67727"/>
      <stop offset="100%" stop-color="#5a3d0e"/>
    </linearGradient>
    <filter id="rodShadow" x="-5%" y="-20%" width="110%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#rodShadow)">
    <!-- Main Cylinder -->
    <rect x="24" y="8" width="352" height="16" rx="4" fill="url(#rodGrad)"/>
    <rect x="24" y="10" width="352" height="3" fill="#ffffff" opacity="0.4"/>
    <!-- Left Finial Knob -->
    <path d="M10 16 C10 10 18 8 24 8 L24 24 C18 24 10 22 10 16 Z" fill="url(#rodGrad)"/>
    <circle cx="10" cy="16" r="6" fill="url(#rodGrad)"/>
    <circle cx="8" cy="16" r="2.5" fill="#fff4d0"/>
    <!-- Right Finial Knob -->
    <path d="M390 16 C390 10 382 8 376 8 L376 24 C382 24 390 22 390 16 Z" fill="url(#rodGrad)"/>
    <circle cx="390" cy="16" r="6" fill="url(#rodGrad)"/>
    <circle cx="392" cy="16" r="2.5" fill="#fff4d0"/>
    <!-- Center Grip Ring -->
    <rect x="194" y="6" width="12" height="20" rx="3" fill="#5a3d0e" stroke="url(#rodGrad)" stroke-width="1.5"/>
  </g>
</svg>
