<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 120" width="60" height="120" fill="none">
  <defs>
    <linearGradient id="tasselGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d4"/>
      <stop offset="40%" stop-color="#dfba6a"/>
      <stop offset="80%" stop-color="#b8832a"/>
      <stop offset="100%" stop-color="#694611"/>
    </linearGradient>
    <filter id="tasselGlow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#4a1520" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#tasselGlow)">
    <!-- Silk Hanging Cord -->
    <path d="M30 0 L30 35" stroke="url(#tasselGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M29 0 L29 35" stroke="#fff" stroke-width="1" opacity="0.6"/>

    <!-- Top Cap Bead -->
    <circle cx="30" cy="38" r="7" fill="url(#tasselGold)"/>
    <circle cx="28" cy="36" r="2" fill="#fff" opacity="0.7"/>

    <!-- Tassel Skirt Top Ring -->
    <ellipse cx="30" cy="48" rx="10" ry="4" fill="url(#tasselGold)"/>
    <ellipse cx="30" cy="48" rx="8" ry="2" fill="#694611"/>

    <!-- Golden Threads / Fringe -->
    <path d="M20 49 Q 15 80 12 110" stroke="url(#tasselGold)" stroke-width="2"/>
    <path d="M24 49 Q 20 80 18 112" stroke="url(#tasselGold)" stroke-width="2"/>
    <path d="M28 50 Q 26 82 25 115" stroke="url(#tasselGold)" stroke-width="2"/>
    <path d="M30 50 Q 30 84 30 116" stroke="#fff" stroke-width="2" opacity="0.9"/>
    <path d="M32 50 Q 34 82 35 115" stroke="url(#tasselGold)" stroke-width="2"/>
    <path d="M36 49 Q 40 80 42 112" stroke="url(#tasselGold)" stroke-width="2"/>
    <path d="M40 49 Q 45 80 48 110" stroke="url(#tasselGold)" stroke-width="2"/>

    <!-- Decorative Ruby Gem at center -->
    <circle cx="30" cy="48" r="3" fill="#6e1f2f"/>
    <circle cx="29" cy="47" r="1" fill="#ffccd5"/>
  </g>
</svg>
