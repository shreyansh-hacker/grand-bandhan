<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd"/>
      <stop offset="40%" stop-color="#dfba6a"/>
      <stop offset="80%" stop-color="#c99a3e"/>
      <stop offset="100%" stop-color="#9a7125"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#48121d" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Mandala Emblem -->
  <g transform="translate(15, 8)" filter="url(#goldGlow)">
    <!-- Outer Decorative Arch / Ring -->
    <circle cx="32" cy="32" r="30" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="32" cy="32" r="26" stroke="#6e1f2f" stroke-width="2"/>
    <circle cx="32" cy="32" r="24" fill="#6e1f2f"/>
    <!-- Lotus / Kalash Petals -->
    <path d="M32 16 C35 23 43 27 43 34 C43 40 37 44 32 44 C27 44 21 40 21 34 C21 27 29 23 32 16 Z" fill="url(#goldGrad)"/>
    <path d="M32 24 C30 28 26 31 24 35 C29 36 31 32 32 24 Z" fill="#fff" opacity="0.4"/>
    <!-- Central Knot -->
    <circle cx="32" cy="34" r="3" fill="#6e1f2f"/>
    <circle cx="32" cy="34" r="1.5" fill="url(#goldGrad)"/>
    <!-- Flourish Dots -->
    <circle cx="32" cy="11" r="2" fill="url(#goldGrad)"/>
    <circle cx="32" cy="53" r="2" fill="url(#goldGrad)"/>
    <circle cx="11" cy="32" r="2" fill="url(#goldGrad)"/>
    <circle cx="53" cy="32" r="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <text x="88" y="38" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="#6e1f2f">
    GRAND BANDHAN
  </text>
  <text x="88" y="55" font-family="'Cinzel', serif" font-size="11" font-weight="600" letter-spacing="4" fill="url(#goldGrad)">
    INVITE STUDIO
  </text>
  <text x="238" y="55" font-family="'Noto Serif Devanagari', serif" font-size="9" font-weight="500" letter-spacing="1" fill="#7d6a58">
    · इनवाइट स्टूडियो
  </text>
</svg>
